name: API CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CriatorioVirtual.sln

      - name: Build
        run: dotnet build CriatorioVirtual.sln --no-restore --configuration Release

      - name: Build API container
        run: docker build --file src/CriatorioVirtual.Api/Dockerfile --tag criatorio-virtual-api:ci .

      - name: Install Playwright Chromium
        run: pwsh src/CriatorioVirtual.Api/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Test
        run: dotnet test CriatorioVirtual.sln --no-build --configuration Release --logger "console;verbosity=normal"
