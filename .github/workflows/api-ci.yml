name: API CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/api-ci.yml'
      - '.dockerignore'
      - '**/Dockerfile'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'NuGet.config'
      - 'CriatorioVirtual.sln'
      - 'Directory.Build.props'
      - 'src/**'
      - 'tests/**'
      - 'compose.yaml'
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/api-ci.yml'
      - '.dockerignore'
      - '**/Dockerfile'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'NuGet.config'
      - 'CriatorioVirtual.sln'
      - 'Directory.Build.props'
      - 'src/**'
      - 'tests/**'
      - 'compose.yaml'

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  detect-container-changes:
    name: Detect container changes
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.filter.outputs.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check container build paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            container:
              - '.dockerignore'
              - '**/Dockerfile'
              - 'src/**/*.csproj'
              - 'src/**/*.props'
              - 'src/**/*.targets'
              - 'global.json'
              - 'NuGet.config'
              - 'Directory.Build.*'
              - 'Directory.Packages.*'
              - 'CriatorioVirtual.sln'
              - 'compose.yaml'

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'CriatorioVirtual.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore CriatorioVirtual.sln --verbosity minimal

      - name: Build unit and architecture tests
        run: |
          dotnet build tests/CriatorioVirtual.Domain.Tests/CriatorioVirtual.Domain.Tests.csproj --no-restore --configuration Release --verbosity minimal
          dotnet build tests/CriatorioVirtual.Application.Tests/CriatorioVirtual.Application.Tests.csproj --no-restore --configuration Release --verbosity minimal
          dotnet build tests/CriatorioVirtual.ArchitectureTests/CriatorioVirtual.ArchitectureTests.csproj --no-restore --configuration Release --verbosity minimal

      - name: Test unit and architecture projects
        run: |
          dotnet test tests/CriatorioVirtual.Domain.Tests/CriatorioVirtual.Domain.Tests.csproj --no-build --no-restore --configuration Release --logger "console;verbosity=minimal"
          dotnet test tests/CriatorioVirtual.Application.Tests/CriatorioVirtual.Application.Tests.csproj --no-build --no-restore --configuration Release --logger "console;verbosity=minimal"
          dotnet test tests/CriatorioVirtual.ArchitectureTests/CriatorioVirtual.ArchitectureTests.csproj --no-build --no-restore --configuration Release --logger "console;verbosity=minimal"

  integration-tests:
    name: Integration tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - group: rendering-badges
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentRendererTests.RenderBadgeAsync|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentRendererTests.RenderCompetitionBadge|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentRendererTests.AssembleAsync'
          - group: rendering-certificates
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentRendererTests.RenderGenealogyCertificateAsync'
          - group: rendering-other
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentRendererTests.RenderDocumentsAsync|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentRendererTests.RenderProvenanceDocumentAsync|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentRendererTests.ChromiumRenderer|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentTemplateCatalogTests|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Reports'
          - group: rendering-endpoints
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.BadgeBatchEndpointTests|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentGenerationEndpointTests|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Documents.DocumentQueryAndReissueEndpointTests'
          - group: core
            filter: 'FullyQualifiedName!~CriatorioVirtual.IntegrationTests.Documents&FullyQualifiedName!~CriatorioVirtual.IntegrationTests.Reports&FullyQualifiedName!~CriatorioVirtual.IntegrationTests.Birds&FullyQualifiedName!~CriatorioVirtual.IntegrationTests.Identity&FullyQualifiedName!~CriatorioVirtual.IntegrationTests.Transfers&FullyQualifiedName!~CriatorioVirtual.IntegrationTests.Reproductions&FullyQualifiedName!~CriatorioVirtual.IntegrationTests.BreedingFarms&FullyQualifiedName!~CriatorioVirtual.IntegrationTests.Storage'
          - group: birds-attachments
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Birds.BirdAttachmentEndpointTests'
          - group: birds-crud
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Birds.BirdCreationEndpointTests|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Birds.BirdDetailEndpointTests|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Birds.BirdStatusEndpointTests|FullyQualifiedName~CriatorioVirtual.IntegrationTests.Birds.BirdUpdateEndpointTests'
          - group: birds-genealogy
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Birds.BirdGenealogyEndpointTests'
          - group: birds-listing
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Birds.BirdListingEndpointTests'
          - group: identity
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Identity'
          - group: lifecycle-transfers
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Transfers'
          - group: lifecycle-reproductions
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Reproductions'
          - group: lifecycle-breeding-farms
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.BreedingFarms'
          - group: lifecycle-storage
            filter: 'FullyQualifiedName~CriatorioVirtual.IntegrationTests.Storage'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'CriatorioVirtual.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore integration tests
        run: dotnet restore tests/CriatorioVirtual.IntegrationTests/CriatorioVirtual.IntegrationTests.csproj --verbosity minimal

      - name: Build integration tests
        run: dotnet build tests/CriatorioVirtual.IntegrationTests/CriatorioVirtual.IntegrationTests.csproj --no-restore --configuration Release --verbosity minimal

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/CriatorioVirtual.Infrastructure/CriatorioVirtual.Infrastructure.csproj') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh src/CriatorioVirtual.Api/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Test integration group
        run: dotnet test tests/CriatorioVirtual.IntegrationTests/CriatorioVirtual.IntegrationTests.csproj --no-build --no-restore --configuration Release --filter "${{ matrix.filter }}" --logger "console;verbosity=minimal"

  container:
    name: Build API container
    needs: detect-container-changes
    if: needs.detect-container-changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/CriatorioVirtual.Api/Dockerfile
          tags: criatorio-virtual-api:ci
          load: true
          cache-from: type=gha,scope=api-container
          cache-to: type=gha,mode=max,scope=api-container,ignore-error=true
